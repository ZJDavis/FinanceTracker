services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financetracker
      POSTGRES_USER: finance_demo
      POSTGRES_PASSWORD: ${FINANCETRACKER_POSTGRES_PASSWORD:?Run scripts/backend.ps1 to generate a local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_demo -d financetracker"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - finance_internal

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - finance_internal

  api:
    build:
      context: .
      dockerfile: FinanceTracker.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FinanceTracker: Host=database;Port=5432;Database=financetracker;Username=finance_demo;Password=${FINANCETRACKER_POSTGRES_PASSWORD:?Run scripts/backend.ps1 to generate a local .env file}
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: finance.transaction-events.v1
      Kafka__ConsumerGroup: finance-tracker-demo
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FINANCETRACKER_API_PORT:-5080}:8080"
    networks:
      - finance_internal

networks:
  finance_internal:
    driver: bridge

volumes:
  postgres_data:
